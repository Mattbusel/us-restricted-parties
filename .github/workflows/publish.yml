name: publish

# Push a tag like v0.6.0 to build the Python loader (src/us_restricted_parties), test the wheel, attach it to a
# GitHub release and upload it to PyPI as `us-restricted-parties` with trusted publishing (no API token here).
#
# The code release is never marked latest: releases/latest/download/<file> must keep pointing at the newest
# data-* release, which the daily build creates.
#
# One-time setup on pypi.org (Account settings -> Publishing -> Add a new pending publisher): project name
# us-restricted-parties, owner Mattbusel, repository us-restricted-parties, workflow publish.yml, environment pypi.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        if: github.event_name == 'push'
        run: |
          module=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/us_restricted_parties/__init__.py').read()).group(1))")
          echo "tag=${GITHUB_REF_NAME} module=${module}"
          test "${GITHUB_REF_NAME}" = "v${module}"
      - name: Build and check
        run: |
          python -m pip install build twine
          pyproject-build  # not "python -m build": the repo root has a build.py that would shadow it
          python -m twine check --strict dist/*
      - name: Test the wheel outside the source tree
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/pip install dist/*.whl
          cd /tmp
          /tmp/w/bin/us-restricted-parties --version
          /tmp/w/bin/us-restricted-parties --list us_far_889 --verify
          /tmp/w/bin/python -c "import us_restricted_parties as u; t = u.latest_release(); assert len(u.load('us_dod_1260h', release=t, verify=True)) > 100, t"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release with the wheel and sdist attached (not marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 {p=1; next} /^## / && p {exit} p' CHANGELOG.md)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" dist/* --latest=false \
              --title "Python loader ${GITHUB_REF_NAME}" --notes "$notes"

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    # Until the PyPI pending publisher exists the upload fails; the GitHub release above is still the release.
    continue-on-error: true
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
