name: build

# Rebuilds the five lists from the official sources every day, derives the affiliates feed, and publishes a new
# release only when a list or the affiliates file changed, so releases/latest/download/<file> is always current.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the ownership rule engine
        run: python -m pip install "ownership-rules @ git+https://github.com/Mattbusel/ownership-rules@716929cac969819a61774221f630c0b9aef88101"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Download the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download --repo "$GITHUB_REPOSITORY" --dir prev --pattern '*.jsonl' --pattern manifest.json --pattern affiliates.ftm.json --pattern affiliates.manifest.json || echo "no previous release"
      - name: Build
        run: python build.py --out dist --prev prev
      # Derived affiliates (ownership-rules over GLEIF Level 2 and the 1260H notices). GLEIF comes from the golden
      # copy server, else GLEIF's AWS Open Data mirror, else the per-record GLEIF API. If none works, or the GLEIF
      # data is more than 48 hours old, affiliates.py carries the previous release's affiliates files forward
      # unchanged, with stale: true, their own older data_date and the error in affiliates.manifest.json and in the
      # manifest.json `affiliates` entry, and emits a warning annotation. The affiliates never fail this job: the
      # five lists build and publish on their own schedule.
      - name: Affiliates
        run: |
          python affiliates.py --lists dist --out dist --prev prev --cache .cache || echo "::warning title=affiliates not built::affiliates.py exited $?; this release has no affiliates files (no previous feed to carry forward). The lists publish as usual."
      - name: Publish when a list changed
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(jq -r .content_sha256 dist/manifest.json)
          old=$(jq -r .content_sha256 prev/manifest.json 2>/dev/null || echo none)
          cat dist/CHANGES.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f dist/affiliates.manifest.json ]; then
            echo "Affiliates data date: $(jq -r '.data_date' dist/affiliates.manifest.json) ($(jq -r '.gleif_route + ", " + .gleif_coverage' dist/affiliates.manifest.json))$(jq -r 'if .stale then ", STALE: carried from the previous release: " + .error else "" end' dist/affiliates.manifest.json)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Affiliates: not built in this run." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # all.csv was added after the first releases; the first run that finds the latest release without it
          # publishes once even if no list changed, so releases/latest/download/all.csv exists.
          if [ "$new" = "$old" ] && gh release view --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx all.csv; then
            echo "No list changed since the latest release." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          day=$(date -u +%Y-%m-%d)
          tag="data-$day"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then tag="$tag-$(date -u +%H%M)"; fi
          # GitHub rejects empty release assets (HTTP 400 Bad Content-Length), and a release with no affiliates
          # change events has an empty affiliates.changes.jsonl, so only non-empty files are attached. A file missing
          # from a release had no records in that build.
          files=$(find dist -maxdepth 1 -type f -size +0c \( -name '*.jsonl' -o -name all.csv -o -name manifest.json -o -name CHANGES.md \
            -o -name affiliates.ftm.json -o -name affiliates.manifest.json \) | sort)
          gh release create "$tag" $files \
            --repo "$GITHUB_REPOSITORY" --title "Lists as of $day" --notes-file dist/CHANGES.md --latest
          echo "released=true" >> "$GITHUB_OUTPUT"
      # Mirrors the lists to huggingface.co/datasets/tensorust/us-restricted-parties (parquet split per list plus the
      # Senzing files). hf_publish.py uploads only when the dataset does not already hold these lists, so this also
      # catches up after a missed day. Skipped until the HF_TOKEN repository secret (a write token) is added.
      - name: Mirror to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set; Hugging Face mirror skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pip install --quiet "huggingface_hub>=0.24" "pyarrow>=15"
          python hf_publish.py --dist dist --repo tensorust/us-restricted-parties
      # Freshness heartbeat. Runs on every run, also when nothing changed, when an agency pull failed (the release then
      # keeps the previous file) and when an earlier step failed, and commits status.json to the `status` branch:
      # https://raw.githubusercontent.com/Mattbusel/us-restricted-parties/status/status.json (docs/status.md).
      # A consumer that sees generated_at older than 30 hours knows the build stopped.
      - name: Publish the freshness heartbeat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo "")
          python status.py --dist dist --prev prev --last-release "$tag" --released "${{ steps.publish.outputs.released }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --job-status "${{ job.status }}" \
            --out "$RUNNER_TEMP/status.json"
          jq -r '"Heartbeat: ok=\(.ok), errors=\(.errors | keys | join(", "))"' "$RUNNER_TEMP/status.json" | tee -a "$GITHUB_STEP_SUMMARY"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898333+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin status; then
            git worktree add -B status "$RUNNER_TEMP/hb" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/hb"
            git -C "$RUNNER_TEMP/hb" checkout --orphan status
            git -C "$RUNNER_TEMP/hb" rm -rfq .
          fi
          cp "$RUNNER_TEMP/status.json" "$RUNNER_TEMP/hb/status.json"
          printf '%s\n' "# status" "" "Freshness heartbeat of the daily build, rewritten on every run. See" \
            "https://github.com/$GITHUB_REPOSITORY/blob/main/docs/status.md" > "$RUNNER_TEMP/hb/README.md"
          git -C "$RUNNER_TEMP/hb" add status.json README.md
          git -C "$RUNNER_TEMP/hb" commit -qm "heartbeat $(jq -r .generated_at "$RUNNER_TEMP/status.json")"
          git -C "$RUNNER_TEMP/hb" push -q origin status
