name: build

# Rebuilds the five lists from the official sources every day, derives the affiliates feed, and publishes a new
# release only when a list or the affiliates file changed, so releases/latest/download/<file> is always current.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the ownership rule engine
        run: python -m pip install "ownership-rules==0.1.0" || python -m pip install "ownership-rules @ git+https://github.com/Mattbusel/ownership-rules@v0.1.0"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Download the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download --repo "$GITHUB_REPOSITORY" --dir prev --pattern '*.jsonl' --pattern manifest.json --pattern affiliates.ftm.json || echo "no previous release"
      - name: Build
        run: python build.py --out dist --prev prev
      # Derived affiliates (ownership-rules over GLEIF Level 2 and the 1260H notices). A failure keeps the previous
      # affiliates files and never blocks the five lists.
      - name: Affiliates
        run: python affiliates.py --lists dist --out dist --prev prev --cache .cache || echo "::warning::affiliates build failed; lists published without it"
      - name: Publish when a list changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(jq -r .content_sha256 dist/manifest.json)
          old=$(jq -r .content_sha256 prev/manifest.json 2>/dev/null || echo none)
          cat dist/CHANGES.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$new" = "$old" ]; then
            echo "No list changed since the latest release." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          day=$(date -u +%Y-%m-%d)
          tag="data-$day"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then tag="$tag-$(date -u +%H%M)"; fi
          gh release create "$tag" dist/*.jsonl dist/manifest.json dist/CHANGES.md $(ls dist/affiliates.ftm.json dist/affiliates.manifest.json 2>/dev/null) \
            --repo "$GITHUB_REPOSITORY" --title "Lists as of $day" --notes-file dist/CHANGES.md --latest
      # Mirrors the lists to huggingface.co/datasets/tensorust/us-restricted-parties (parquet split per list plus the
      # Senzing files). hf_publish.py uploads only when the dataset does not already hold these lists, so this also
      # catches up after a missed day. Skipped until the HF_TOKEN repository secret (a write token) is added.
      - name: Mirror to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set; Hugging Face mirror skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pip install --quiet "huggingface_hub>=0.24" "pyarrow>=15"
          python hf_publish.py --dist dist --repo tensorust/us-restricted-parties
