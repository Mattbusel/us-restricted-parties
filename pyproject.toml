[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# The Python loader only. The daily build scripts (build.py, affiliates.py) are not part of the package.
[project]
name = "us-restricted-parties"
dynamic = ["version"]
description = "Load the US Restricted Parties feed (DoD 1260H, Section 889, FCC Covered List, UFLPA, BIOSECURE and their 50 percent affiliates) from pinned, hash-checked daily releases. Standard library only."
readme = "docs/package.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tensorust LLC" }]
keywords = ["sanctions", "restricted-parties", "1260h", "uflpa", "section-889", "fcc-covered-list", "screening", "senzing", "followthemoney", "compliance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
us-restricted-parties = "us_restricted_parties:main"

[project.urls]
Homepage = "https://github.com/Mattbusel/us-restricted-parties"
Documentation = "https://github.com/Mattbusel/us-restricted-parties/blob/main/docs/integration.md"
Changelog = "https://github.com/Mattbusel/us-restricted-parties/blob/main/CHANGELOG.md"
Issues = "https://github.com/Mattbusel/us-restricted-parties/issues"
Data = "https://github.com/Mattbusel/us-restricted-parties/releases/latest"

[tool.hatch.version]
path = "src/us_restricted_parties/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/us_restricted_parties"]

[tool.hatch.build.targets.sdist]
include = ["src", "docs/package.md", "CHANGELOG.md", "LICENSE", "LICENSE-DATA", "tests/test_load.py", "tests/fixtures/feed_excerpt.jsonl", "tests/fixtures/affiliates_excerpt.senzing.jsonl", "tools/load.py"]
